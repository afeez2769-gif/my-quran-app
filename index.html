<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30Juzuk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#eef2ea;
    --card:#0f1f16;
    --card-2:#16281d;
    --gold:#d4a24e;
    --gold-soft:#e6c07f;
    --cream:#f4f1e6;
    --muted-on-dark:#8fa196;
    --muted:#6f7d76;
    --line: rgba(15,31,22,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:#12241a;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .screen{
    width:100%;
    max-width:420px;
    padding:22px 18px 40px;
  }

  /* header */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-icon{
    width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
  }
  .brand-text .loc{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.14em;
    color:var(--gold);
    text-transform:uppercase;
  }
  .brand-text h1{
    font-family:'Amiri',serif;
    font-size:22px;
    margin:2px 0 0;
    color:#132018;
  }
  .icon-btns{ display:flex; gap:10px; }
  .icon-btn{
    width:38px;height:38px;
    border-radius:50%;
    background:#fff;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:#12241a;
    font-size:16px;
  }
  .icon-btn:hover{ background:#f4f1e6; }

  /* main card */
  .main-card{
    background:linear-gradient(165deg, var(--card), var(--card-2));
    border-radius:26px;
    padding:24px 22px 20px;
    position:relative;
    overflow:hidden;
    box-shadow:0 20px 40px -18px rgba(15,31,22,0.5);
  }
  .main-card::before{
    content:'';
    position:absolute;
    right:-40px; bottom:-60px;
    width:220px;height:220px;
    border-radius:50%;
    border:1px solid rgba(244,241,230,0.06);
  }
  .main-card::after{
    content:'';
    position:absolute;
    right:20px; bottom:-100px;
    width:280px;height:280px;
    border-radius:50%;
    border:1px solid rgba(244,241,230,0.05);
  }

  .next-label{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.16em;
    color:var(--gold);
    text-transform:uppercase;
  }
  .next-time{
    font-family:'Amiri',serif;
    font-size:52px;
    color:var(--cream);
    margin:4px 0 2px;
    position:relative;
    z-index:1;
  }
  .countdown{
    font-size:13px;
    color:var(--muted-on-dark);
    margin-bottom:18px;
  }

  .kiblat-card{
    background:rgba(244,241,230,0.06);
    border:1px solid rgba(244,241,230,0.1);
    border-radius:16px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.15s ease;
    text-decoration:none;
    position:relative; z-index:1;
    margin-bottom:16px;
  }
  .kiblat-card:hover{ background:rgba(244,241,230,0.1); transform:translateY(-1px); }
  .kiblat-icon{
    width:38px;height:38px;
    border-radius:10px;
    background:rgba(212,162,78,0.15);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    flex-shrink:0;
  }
  .kiblat-text{ flex:1; }
  .kiblat-eyebrow{
    font-size:10px;
    font-weight:700;
    letter-spacing:0.14em;
    color:var(--muted-on-dark);
    text-transform:uppercase;
  }
  .kiblat-title{
    font-size:15px;
    font-weight:600;
    color:var(--cream);
    margin-top:2px;
  }
  .kiblat-sub{
    font-size:11px;
    color:var(--muted-on-dark);
    margin-top:2px;
  }
  .kiblat-arrow{ color:var(--gold); font-size:18px; }

  .prayer-row{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    position:relative; z-index:1;
  }
  .prayer-pill{
    background:rgba(244,241,230,0.05);
    border:1px solid rgba(244,241,230,0.08);
    border-radius:14px;
    padding:10px 4px;
    text-align:center;
    text-decoration:none;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .prayer-pill:hover{ transform:translateY(-2px); }
  .prayer-pill.active{
    background:rgba(212,162,78,0.14);
    border-color:var(--gold);
  }
  .prayer-pill .pname{
    font-size:10px;
    font-weight:700;
    letter-spacing:0.06em;
    color:var(--muted-on-dark);
  }
  .prayer-pill.active .pname{ color:var(--gold-soft); }
  .prayer-pill .ptime{
    font-size:13px;
    font-weight:700;
    color:var(--cream);
    margin-top:4px;
  }
  .prayer-pill.active .ptime{ color:var(--gold); }

  .status-line{
    margin-top:16px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }

  .schedule-link{
    display:block;
    text-align:center;
    margin-top:18px;
    font-size:13px;
    font-weight:600;
    color:#12241a;
    text-decoration:none;
    padding:12px;
    border-radius:14px;
    border:1px solid var(--line);
    background:#fff;
  }
  .schedule-link:hover{ background:#f4f1e6; }
</style>
</head>
<body>
<div class="screen">

  <header>
    <div class="brand">
      <div class="brand-icon">🕌</div>
      <div class="brand-text">
        <div class="loc" id="locLabel">Mengesan lokasi…</div>
        <h1>Assalamu'alaikum</h1>
      </div>
    </div>
    <div class="icon-btns">
      <div class="icon-btn" title="Info">ⓘ</div>
      <div class="icon-btn" title="Mod Gelap">☾</div>
    </div>
  </header>

  <div class="main-card">
    <div class="next-label" id="nextLabel">SELANJUTNYA · —</div>
    <div class="next-time" id="nextTime">--:--</div>
    <div class="countdown" id="countdown">Mengira waktu solat…</div>

    <a class="kiblat-card" href="kiblat.html">
      <div class="kiblat-icon">🧭</div>
      <div class="kiblat-text">
        <div class="kiblat-eyebrow">Arah Kiblat</div>
        <div class="kiblat-title">Buka Kompas</div>
        <div class="kiblat-sub" id="hijriDate">—</div>
      </div>
      <div class="kiblat-arrow">›</div>
    </a>

    <div class="prayer-row" id="prayerRow">
      <a class="prayer-pill" data-name="Subuh" href="jadual.html"><div class="pname">SBH</div><div class="ptime">--:--</div></a>
      <a class="prayer-pill" data-name="Zohor" href="jadual.html"><div class="pname">DZH</div><div class="ptime">--:--</div></a>
      <a class="prayer-pill" data-name="Asar" href="jadual.html"><div class="pname">ASH</div><div class="ptime">--:--</div></a>
      <a class="prayer-pill" data-name="Maghrib" href="jadual.html"><div class="pname">MAG</div><div class="ptime">--:--</div></a>
      <a class="prayer-pill" data-name="Isyak" href="jadual.html"><div class="pname">ISY</div><div class="ptime">--:--</div></a>
    </div>
  </div>

  <div class="status-line" id="statusLine">Sila benarkan akses lokasi untuk waktu solat yang tepat.</div>

  <a class="schedule-link" href="jadual.html">Lihat Jadual Penuh & Jemaah →</a>

</div>

<script src="prayertimes.js"></script>
<script>
(function(){
  const locLabel = document.getElementById('locLabel');
  const statusLine = document.getElementById('statusLine');
  const nextLabel = document.getElementById('nextLabel');
  const nextTime = document.getElementById('nextTime');
  const countdown = document.getElementById('countdown');
  const hijriDate = document.getElementById('hijriDate');
  const pills = document.querySelectorAll('.prayer-pill');

  const names = ['Subuh','Syuruk','Zohor','Asar','Maghrib','Isyak'];
  let timesMap = null;

  function fmt(hoursFloat){
    if (isNaN(hoursFloat)) return '--:--';
    let h = Math.floor(hoursFloat);
    let m = Math.round((hoursFloat - h) * 60);
    if(m === 60){ m = 0; h += 1; }
    h = ((h % 24) + 24) % 24;
    const period = h >= 12 ? 'PM' : 'AM';
    let h12 = h % 12; if(h12 === 0) h12 = 12;
    return `${h12}:${String(m).padStart(2,'0')}${period}`;
  }

  function hijri(date){
    // Kuwaiti algorithm approximation
    let jd = Math.floor((1461*(date.getFullYear()+4800+Math.floor((date.getMonth()+1-14)/12)))/4)
      + Math.floor((367*(date.getMonth()+1-2-12*(Math.floor((date.getMonth()+1-14)/12))))/12)
      - Math.floor((3*Math.floor((date.getFullYear()+4900+Math.floor((date.getMonth()+1-14)/12))/100))/4)
      + date.getDate() - 32075;
    let l = jd - 1948440 + 10632;
    let n = Math.floor((l-1)/10631);
    l = l - 10631*n + 354;
    let j = (Math.floor((10985-l)/5316))*(Math.floor((50*l)/17719)) + (Math.floor(l/5670))*(Math.floor((43*l)/15238));
    l = l - (Math.floor((30-j)/15))*(Math.floor((17719*j)/50)) - (Math.floor(j/16))*(Math.floor((15238*j)/43)) + 29;
    const hMonth = Math.floor((24*l)/709);
    const hDay = l - Math.floor((709*hMonth)/24);
    const hYear = 30*n + j - 30;
    const monthNames = ['Muharram','Safar',"Rabiulawal","Rabiulakhir",'Jamadilawal','Jamadilakhir','Rejab','Syaaban','Ramadan','Syawal','Zulkaedah','Zulhijjah'];
    return `${hDay} ${monthNames[hMonth-1]} ${hYear}H`;
  }

  function render(date, lat, lng, tz){
    const t = PrayerTimes.getTimes(date, lat, lng, tz);
    timesMap = t;
    const order = ['fajr','dhuhr','asr','maghrib','isha'];
    const labels = {fajr:'Subuh',dhuhr:'Zohor',asr:'Asar',maghrib:'Maghrib',isha:'Isyak'};

    pills.forEach((p) => {
      const key = Object.keys(labels).find(k => labels[k] === p.dataset.name);
      p.querySelector('.ptime').textContent = fmt(t[key]);
    });

    const now = date.getHours() + date.getMinutes()/60 + date.getSeconds()/3600;
    let nextKey = order.find(k => t[k] > now);
    let nextDate = date;
    if(!nextKey){ nextKey = 'fajr'; }

    nextLabel.textContent = 'SELANJUTNYA · ' + labels[nextKey].toUpperCase();
    nextTime.textContent = fmt(t[nextKey]);

    let diff = t[nextKey] - now;
    if(diff < 0) diff += 24;
    const hh = Math.floor(diff);
    const mm = Math.floor((diff-hh)*60);
    const ss = Math.floor((((diff-hh)*60)-mm)*60);
    countdown.textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')} lagi`;

    pills.forEach(p => p.classList.toggle('active', p.dataset.name === labels[nextKey]));
    hijriDate.textContent = hijri(date);
  }

  function startClock(lat,lng,tz){
    render(new Date(), lat, lng, tz);
    setInterval(() => render(new Date(), lat, lng, tz), 1000);
  }

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition((pos) => {
      const { latitude, longitude } = pos.coords;
      const tz = -new Date().getTimezoneOffset()/60;
      statusLine.textContent = 'Waktu solat dikira berdasarkan lokasi semasa.';
      startClock(latitude, longitude, tz);

      fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=ms`)
        .then(r => r.json())
        .then(d => {
          locLabel.textContent = (d.city || d.locality || d.principalSubdivision || 'Lokasi Anda').toUpperCase();
        })
        .catch(() => { locLabel.textContent = 'LOKASI ANDA'; });

    }, () => {
      statusLine.textContent = 'Gagal dapatkan lokasi. Guna anggaran waktu Kuala Lumpur.';
      locLabel.textContent = 'KUALA LUMPUR';
      startClock(3.139, 101.6869, 8);
    });
  } else {
    statusLine.textContent = 'Geolokasi tidak disokong. Guna anggaran waktu Kuala Lumpur.';
    locLabel.textContent = 'KUALA LUMPUR';
    startClock(3.139, 101.6869, 8);
  }
})();
</script>
</body>
</html>
