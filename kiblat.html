<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arah Kiblat — 30Juzuk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#eef2ea;
    --card:#0f1f16;
    --card-2:#16281d;
    --gold:#d4a24e;
    --gold-soft:#e6c07f;
    --cream:#f4f1e6;
    --muted-on-dark:#8fa196;
    --muted:#6f7d76;
    --line: rgba(15,31,22,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:#12241a;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .screen{ width:100%; max-width:420px; padding:22px 18px 40px; }

  header{ display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .back{
    width:38px;height:38px;border-radius:50%;
    background:#fff; border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    text-decoration:none; color:#12241a; font-size:18px;
  }
  .back:hover{ background:#f4f1e6; }
  header h1{
    font-family:'Amiri',serif;
    font-size:22px;
    margin:0;
    color:#132018;
  }

  .card{
    background:linear-gradient(165deg, var(--card), var(--card-2));
    border-radius:26px;
    padding:26px 20px 30px;
    position:relative;
    overflow:hidden;
    box-shadow:0 20px 40px -18px rgba(15,31,22,0.5);
    display:flex; flex-direction:column; align-items:center;
  }
  .card::after{
    content:'';
    position:absolute; right:-60px; bottom:-90px;
    width:260px;height:260px;border-radius:50%;
    border:1px solid rgba(244,241,230,0.05);
  }

  .compass-wrap{
    position:relative;
    width:min(72vw,270px);
    height:min(72vw,270px);
    margin:12px 0 22px;
    z-index:1;
  }
  .ring{
    position:absolute; inset:0; border-radius:50%;
    background:rgba(244,241,230,0.04);
    box-shadow: 0 0 0 1px rgba(212,162,78,0.35), inset 0 0 0 6px rgba(244,241,230,0.04);
  }
  .ring::before{
    content:''; position:absolute; inset:12px; border-radius:50%;
    border:1px dashed rgba(244,241,230,0.15);
  }
  .tick{ position:absolute; left:50%; top:50%; width:2px; height:10px; background:rgba(244,241,230,0.3); transform-origin:50% 125px; }
  .tick.major{ height:16px; width:2.5px; background:rgba(244,241,230,0.55); }
  .dir-label{ position:absolute; font-size:12px; font-weight:700; color:var(--cream); letter-spacing:0.05em; }
  .n{ top:16px; left:50%; transform:translateX(-50%); color:var(--gold-soft); }
  .e{ top:50%; right:12px; transform:translateY(-50%); }
  .s{ bottom:16px; left:50%; transform:translateX(-50%); }
  .w{ top:50%; left:12px; transform:translateY(-50%); }

  .needle{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(0deg); transition:transform 0.4s cubic-bezier(.2,.7,.3,1); }
  .needle .arrow{ position:absolute; left:-12px; top:-98px; width:24px; height:196px; }
  .kaaba{
    position:absolute; left:50%; top:50%; width:24px;height:24px; transform:translate(-50%,-50%);
    background:linear-gradient(160deg,#1b1b1b,#000); border:2px solid var(--gold);
    border-radius:3px; box-shadow:0 0 12px rgba(212,162,78,0.5); z-index:5;
    display:flex; align-items:center; justify-content:center; font-size:10px;
  }

  .angle{ font-family:'Amiri',serif; font-size:40px; color:var(--cream); z-index:1; line-height:1; }
  .angle span{ font-size:18px; color:var(--gold); font-weight:700; }
  .status{ font-size:13px; color:var(--muted-on-dark); margin-top:6px; z-index:1; min-height:18px; }
  .status.ok{ color:var(--gold-soft); font-weight:600; }
  .status.err{ color:#e6897a; }

  button{
    margin-top:20px; background:var(--gold); color:#1b1206;
    border:none; padding:13px 28px; border-radius:999px;
    font-family:'Inter',sans-serif; font-weight:700; font-size:14px;
    cursor:pointer; z-index:1; transition:transform 0.15s ease, background 0.2s ease;
  }
  button:hover{ background:var(--gold-soft); transform:translateY(-1px); }
  button:disabled{ opacity:0.5; cursor:default; transform:none; }

  .note{
    margin-top:20px; font-size:12.5px; color:var(--muted);
    text-align:center; line-height:1.5;
  }
  .note b{ color:#8a6420; }
</style>
</head>
<body>
<div class="screen">
  <header>
    <a class="back" href="index.html">←</a>
    <h1>Arah Kiblat</h1>
  </header>

  <div class="card">
    <div class="compass-wrap">
      <div class="ring" id="ring">
        <span class="dir-label n">U</span>
        <span class="dir-label e">T</span>
        <span class="dir-label s">S</span>
        <span class="dir-label w">B</span>
      </div>
      <div class="needle" id="needle">
        <svg class="arrow" viewBox="0 0 24 196">
          <polygon points="12,0 24,54 12,40 0,54" fill="#e6c07f"/>
          <rect x="10" y="40" width="4" height="136" fill="rgba(244,241,230,0.4)" rx="2"/>
        </svg>
      </div>
      <div class="kaaba">🕋</div>
    </div>

    <div class="angle" id="angleText">--<span>°</span></div>
    <div class="status" id="statusText">Tekan butang untuk mula</div>
    <button id="startBtn">Kesan Lokasi Saya</button>
  </div>

  <p class="note"><b>Nota:</b> Sudut diukur dari Utara sebenar, ikut arah jam. Kalibrasi kompas telefon anda untuk hasil lebih tepat.</p>
</div>

<script>
  const KAABA_LAT = 21.4225, KAABA_LNG = 39.8262;
  const ring = document.getElementById('ring');
  const needle = document.getElementById('needle');
  const angleText = document.getElementById('angleText');
  const statusText = document.getElementById('statusText');
  const startBtn = document.getElementById('startBtn');

  for(let i=0;i<72;i++){
    const t = document.createElement('div');
    t.className = 'tick' + (i%9===0 ? ' major' : '');
    t.style.transform = `translate(-50%,-50%) rotate(${i*5}deg)`;
    ring.appendChild(t);
  }

  let qiblaBearing = null, deviceHeading = 0;
  const toRad = d => d*Math.PI/180, toDeg = r => r*180/Math.PI;

  function computeQiblaBearing(lat, lng){
    const phiK = toRad(KAABA_LAT), lambdaK = toRad(KAABA_LNG);
    const phi = toRad(lat), lambda = toRad(lng);
    const y = Math.sin(lambdaK - lambda);
    const x = Math.cos(phi)*Math.tan(phiK) - Math.sin(phi)*Math.cos(lambdaK - lambda);
    return (toDeg(Math.atan2(y,x)) + 360) % 360;
  }

  function updateNeedle(){
    if(qiblaBearing === null) return;
    needle.style.transform = `translate(-50%,-50%) rotate(${qiblaBearing - deviceHeading}deg)`;
  }

  function handleOrientation(e){
    let heading;
    if (e.webkitCompassHeading !== undefined) heading = e.webkitCompassHeading;
    else if (e.alpha !== null) heading = 360 - e.alpha;
    else return;
    deviceHeading = heading;
    updateNeedle();
  }

  function startCompass(){
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(res=>{
        if(res==='granted') window.addEventListener('deviceorientation', handleOrientation, true);
      }).catch(()=>{});
    } else if ('ondeviceorientationabsolute' in window){
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    } else if ('DeviceOrientationEvent' in window){
      window.addEventListener('deviceorientation', handleOrientation, true);
    }
  }

  startBtn.addEventListener('click', () => {
    if(!navigator.geolocation){
      statusText.textContent = 'Geolokasi tidak disokong.';
      statusText.className = 'status err';
      return;
    }
    startBtn.disabled = true;
    statusText.textContent = 'Mengesan lokasi...';
    statusText.className = 'status';
    navigator.geolocation.getCurrentPosition((pos)=>{
      const { latitude, longitude } = pos.coords;
      qiblaBearing = computeQiblaBearing(latitude, longitude);
      angleText.innerHTML = qiblaBearing.toFixed(1) + '<span>°</span>';
      statusText.textContent = 'Sudut kiblat dari Utara sebenar';
      statusText.className = 'status ok';
      updateNeedle();
      startCompass();
      startBtn.textContent = 'Kesan Semula';
      startBtn.disabled = false;
    }, ()=>{
      statusText.textContent = 'Gagal dapatkan lokasi.';
      statusText.className = 'status err';
      startBtn.disabled = false;
    }, { enableHighAccuracy:true, timeout:10000 });
  });
</script>
</body>
</html>
